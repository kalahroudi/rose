# SPDX-License-Identifier: Apache-2.0
# Publishes the project site (site/ plus the logos from brand/) to GitHub Pages.
# Static files only: no build step, no dependencies installed.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "brand/*.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp brand/logo-mark.svg brand/logo-wordmark.svg brand/logo-wordmark-dark.svg _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
