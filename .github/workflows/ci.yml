# SPDX-License-Identifier: Apache-2.0
# The same gate as `pnpm verify` locally, plus a production build.
# Actions are referenced by major version tag. For a stricter supply chain, pin each to a
# full commit SHA (Dependabot keeps SHA pins up to date; see .github/dependabot.yml).
name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Guard, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install (lockfile is authoritative; no lifecycle scripts beyond the allow-list)
        run: pnpm install --frozen-lockfile
      - name: Guardrails (security invariants)
        run: pnpm guard
      - name: Lint
        run: pnpm lint
      - name: Dead code
        run: pnpm knip
      - name: Guard self-tests (with coverage)
        # File patterns, not directories: Node 22 does not accept a directory here.
        # Report only: no coverage thresholds. Writes scripts/coverage/lcov.info.
        run: pnpm test:scripts:coverage
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests (includes the tenant-isolation contract for every module)
        # Same suites as `pnpm test`, instrumented. Fails if coverage drops below the floors in each vitest.config.ts.
        run: pnpm test:coverage
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            packages/core/coverage/
            apps/app/coverage/
            apps/admin/coverage/
            scripts/coverage/
          if-no-files-found: ignore
      - name: Build
        run: pnpm build

  pentest:
    name: Penetration tests (local stack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the local stack
        run: |
          nohup node scripts/dev.mjs > dev.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:5174/api/bootstrap | grep -q '"root"' && curl -sf http://localhost:5173/api/bootstrap > /dev/null && exit 0
            sleep 1
          done
          cat dev.log; exit 1
      - name: Attack it
        run: pnpm pentest --strict --allow-skip ADM-05 --allow-skip ADM-05b --allow-skip ADM-06 --allow-skip GW-01 --allow-skip HARD-01 --allow-skip HARD-05 --allow-skip AUTH-09
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pentest-report
          path: .rose/pentest-report.json
          if-no-files-found: ignore
